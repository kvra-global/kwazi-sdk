name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check the tag matches every package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./packages/node/package.json").version')" = "$version"
          test "$(node -p 'require("./packages/widget/package.json").version')" = "$version"
          grep -q "^version = \"$version\"" packages/python/pyproject.toml
          grep -q "\"$version\"" packages/gradle/build.gradle.kts
      - name: Build and test
        run: |
          mkdir -p out
          for package in node widget; do (cd packages/$package && npm ci && npm test && npm pack --pack-destination ../../out); done
          (cd packages/python && python -m unittest discover -s tests && python -m pip install build && python -m build --outdir ../../out)
          ./gradlew :kwazi:build && cp packages/gradle/build/libs/*.jar out/
          cp packages/widget/dist/kwazi-widget.js out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: out/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          generate_release_notes: true

  maven:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew :kwazi:publishKwaziPublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # npm trusted publishing (OIDC): no token is stored anywhere. Each package lists this repository and
  # release.yml as its trusted publisher on npmjs.com; npm adds provenance automatically.
  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (11.5.1 or later)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish kwazi and kwazi-widget
        run: |
          for package in node widget; do
            (
              cd packages/$package
              name=$(node -p 'require("./package.json").name')
              version=$(node -p 'require("./package.json").version')
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "::notice::$name@$version is already on npm"
              else
                npm ci && npm run build && npm publish --access public
              fi
            )
          done

  pypi:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages
          path: out
      - run: mkdir dist && cp out/*.whl out/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
